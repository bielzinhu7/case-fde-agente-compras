services:
  mcp:
    build: ./mcp-server
    environment:
      DUMMYJSON_URL: ${DUMMYJSON_URL:-https://dummyjson.com}
      DUMMYJSON_TIMEOUT: ${DUMMYJSON_TIMEOUT:-5}
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mcp:*
    # Só para chamar as ferramentas direto do host (ex.: MCP Inspector); o backend usa a rede interna.
    ports:
      - "127.0.0.1:${MCP_PUBLIC_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras
      POSTGRES_DB: compras
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "compras", "-d", "compras"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-5.5}
      MCP_URL: http://mcp:8000/mcp
      DATABASE_URL: postgresql://compras:compras@postgres:5432/compras
    # Só em 127.0.0.1: a API gasta a chave da OpenRouter e não tem autenticação.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat:
    build: ./chat
    ports:
      - "127.0.0.1:${CHAT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dados:
