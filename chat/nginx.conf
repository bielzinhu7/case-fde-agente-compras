server {
    listen 80;
    root /usr/share/nginx/html;

    # O chat chama /api/...; o nginx repassa ao backend pela rede do compose (sem CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        # Um pedido pode levar vários passos do modelo.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
