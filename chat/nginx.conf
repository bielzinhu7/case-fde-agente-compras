server {
    listen 80;
    root /usr/share/nginx/html;

    # O chat chama /api/...; o nginx repassa ao backend pela rede do compose (sem CORS).
    location /api/ {
        # Resolve o nome "backend" a cada pedido, pelo DNS do Docker: se o container for recriado com outro IP
        # (ex.: depois de trocar a chave no .env), o chat continua funcionando sem reiniciar o nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # Backend fora do ar aparece no chat em segundos, não depois do padrão de 60 s.
        proxy_connect_timeout 5s;
        # Um pedido pode levar vários passos do modelo.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
