name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.3
      - run: ruff check mcp-server backend

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Constrói as três imagens (mcp, backend e chat): também confere que os Dockerfiles funcionam.
      - run: docker compose build
      - name: Testes das ferramentas do MCP (sem chave de LLM)
        run: docker compose run --rm --no-deps -T mcp pytest
      - name: Testes do backend (sem chave de LLM)
        run: docker compose run --rm --no-deps -T backend pytest
